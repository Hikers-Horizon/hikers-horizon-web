server {
    server_name hikershorizon.in www.hikershorizon.in;

    # 1. Route WhatsApp bot sync to hikers_app (Port 8082)
    location /api/bot/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Route Admin REST APIs to hikers_app (Port 8082)
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Route all other Swift Seat APIs to Swift Seat Server (Port 3005)
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Default fallback to main hikers_app web frontend/backend
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gokarn.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gokarn.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.hikershorizon.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = hikershorizon.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hikershorizon.in www.hikershorizon.in;
    return 404; # managed by Certbot
}

server {
    server_name gokarn.online www.gokarn.online gokarnabeachtrek.in www.gokarnabeachtrek.in;

    location / {
        proxy_pass http://localhost:8082; # Routes to your Node app!
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gokarn.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gokarn.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gokarn.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gokarn.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.gokarnabeachtrek.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gokarnabeachtrek.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gokarn.online www.gokarn.online gokarnabeachtrek.in www.gokarnabeachtrek.in;
    return 404; # managed by Certbot
}
